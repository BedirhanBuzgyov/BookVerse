{% extends "base.html" %}
{% load static %}

{% block title %}Delete Book{% endblock %}

{% block content %}
<section class="delete-page">
    <div class="delete-card">
        <h1>Delete Book</h1>

        <p>
            Are you sure you want to delete
            <span class="delete-warning">"{{ book.title }}"</span>?
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="delete-actions">
                <button type="submit" class="btn btn-danger">
                    Confirm Delete
                </button>

                <a href="{% url 'book_detail' book.id %}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
