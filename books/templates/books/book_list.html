<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
<h1>Books</h1>
    <p><a href="{% url 'book_create' %}">Add Book</a></p>
    <ul>
        {% for book in books %}
            <li>
            <strong>{{ book.title }}</strong><br>
            Author: {{ book.author.name }}<br>
            Genres:
            {% for genre in book.genres.all %}
                {{ genre.name }}{% if not forloop.last %}, {% endif %}
            {% endfor %}
                <p><a href="{% url 'book_detail' book.id %}">See More</a></p>
            <br><br>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
